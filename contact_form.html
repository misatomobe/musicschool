<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ｜きたむらミュージックスクール</title>
    <meta name="description" content="きたむらミュージックスクールへのお問い合わせページです。レッスンに関するご質問やご相談、資料請求など、お気軽にお問い合わせください。">
    <meta name="keywords" content="きたむらミュージックスクール, お問い合わせ, レッスン, ご質問, ご相談, 資料請求, 音楽教室, 茨城県笠間市">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- 自分のJS -->
    <script src="./js/script.js" defer></script>
</head>
<body>
    <div class="l-container">
        
        <!-- ※共通【header】 -->
        <header id="top" class="l-header">
            <div class="l-header__inner">
                <h1 class="l-header__logo">
                    <a href="./index.html">
                        <span class="c-logo__image">
                            <img src="./images/common/rogo.svg" alt="きたむらミュージックスクール">
                        </span>
                        <span class="c-logo__text">
                            <span class="c-logo__main">きたむら</span>
                            <span class="c-logo__sub">ミュージックスクール</span>
                        </span>
                    </a>
                </h1>
                
                <nav class="l-header__nav u-pc-only">
                    <ul class="l-header__nav-list">
                        <li><a href="./plan.html">料金</a></li>
                        <li><a href="./blog_list.html">ブログ</a></li>
                        <li><a href="./result_list.html">卒業実績</a></li>
                        <li class="is-contact">
                            <a href="./contact_form.html">お問い合わせ</a>
                        </li>
                    </ul>
                </nav>
                
                <!-- SPハンバーガーメニュー用 -->
                <div class="l-header__hamburger u-sp-only">
                    <button class="c-hamburger">
                        <span class="c-hamburger__line"></span>
                    </button>
                    <!-- SPナビ -->
                    <nav class="l-header__sp-nav">
                        <ul class="l-header__sp-nav-lists">
                            <li><a href="./plan.html">料金</a></li>
                            <li><a href="./blog_list.html">ブログ</a></li>
                            <li><a href="./result_list.html">卒業実績</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        <!-- 【main】 -->
        <main class="l-main">

            <!-- 【page-fv】blog/contact/plan/404共通 -->
            <section class="p-blog-fv p-fv">
                <picture>
                    <source srcset="images/send/send_pc.jpg" media="(min-width: 768px)">
                    <img src="images/send/send_sp.jpg" alt="きたむらミュージックスクールのお問い合わせ">
                </picture>
                <div class="p-plan-fv__contents">
                    <div class="p-plan-fv__catch">
                        <h2 class="p-plan-fv__title">
                          お問い合わせ 
                        </h2>
                    </div>
                </div>
            </section>

            <!-- 【breadcrumb】 -->
            <nav class="c-breadcrumb" aria-label="パンくずリスト">
                <div class="c-breadcrumb__inner">
                    <ol class="c-breadcrumb__list">
                        <li class="c-breadcrumb__item">
                            <a href="./index.html">ホーム</a>
                        </li>
                        <li class="c-breadcrumb__item">
                            <span>お問い合わせ</span>
                        </li>
                    </ol>
                </div>
            </nav>

            <!-- 【お問い合わせフォーム】 -->
             <section class="p-contact">
                <div class="l-inner">
                    <div class="p-contact__contents">

                        <!-- お問い合わせフォームページ専用レイアウト -->
                        <div class="p-contact-send__text p-contact-form__text">
                            <p>当校に関するご質問・ご相談・資料請求は下記のフォームからお気軽にお問い合わせください。</p>
                            <p>通常３営業日以内にメールにてご連絡させていただきます。</p>
                        </div>
                        
                        <form action="./contact_send.html" class="p-contact__form">
                            <div class="p-contact__form-block">
                                <!-- 会社名 -->
                                <dl class="p-contact__item">
                                            <dt>
                                                <label for="your-company">会社名</label>
                                            </dt>
                                            <dd>
                                                <input type="text" name="your-company" id="your-company" class="form-control" placeholder="きたむらミュージックスクール" required>
                                            </dd>
                                </dl>
                                        
                                <!-- お名前 -->
                                <dl class="p-contact__item">
                                            <dt>
                                                <label for="your-name">お名前</label>
                                            </dt>
                                            <dd>
                                                <input type="text" name="your-name" id="your-name" class="form-control" placeholder="北村　翔平" required>
                                            </dd>
                                </dl>
                                
                                <!-- メールアドレス -->
                                <dl class="p-contact__item">
                                            <dt>
                                                <label for="your-email">メールアドレス</label>
                                            </dt>
                                            <dd>
                                                <input type="email" name="your-email" id="your-email" class="form-control" placeholder="info@kitamura.musicschool.jp" required>
                                            </dd>
                                </dl>

                                <!-- 電話番号 -->
                                <dl class="p-contact__item">
                                            <dt>
                                                <label for="your-phone">電話番号</label>
                                            </dt>
                                            <dd>
                                                <input type="tel" name="your-phone" id="your-phone" class="form-control" placeholder="090-1234-5678">
                                            </dd>
                                </dl>

                                <!-- チェックボックス -->
                                <dl class="p-contact__item p-contact__item--checkbox">
                                    <dt>
                                        <span class="p-contact__label">目的</span>
                                        <span class="p-contact__note">(複数選択可)</span>
                                    </dt>
                                    <dd class="form-checkbox">
                                        <div class="checkbox-col">
                                            <label class="checkbox-item">
                                                <input type="checkbox" name="how-know" value="プランについてのお問い合わせ">
                                                <span>プランについてのお問い合わせ</span>
                                            </label> 
                                        </div>

                                        <div class="checkbox-col">
                                            <label class="checkbox-item">
                                                <input type="checkbox" name="how-know" value="ヒアリングのご予約">
                                                <span>ヒアリングのご予約</span>
                                            </label>
                                        </div>

                                        <div class="checkbox-col">
                                            <label class="checkbox-item">
                                                <input type="checkbox" name="how-know" value="資料請求">
                                                <span>資料請求</span>
                                            </label>
                                        </div>

                                        <div class="checkbox-col">
                                            <label class="checkbox-item">
                                                <input type="checkbox" name="square-check" value="その他">
                                                <span>その他</span>
                                            </label>
                                        </div>                                            
                                    </dd>
                                </dl>

                                <!-- 内容 -->
                                <dl class="p-contact__item p-contact__item--textarea">
                                    <dt>
                                        <label for="your-content"><span class="p-contact__label">内容</span></label>
                                    </dt>
                                    <dd>
                                        <textarea name="your-content" id="your-content" class="form-control form-textarea" cols="30" rows="10" required placeholder="内容に関する詳細や備考等をご入力ください。"></textarea>
                                    </dd>
                                </dl>                                    

                                <!-- 【送信ボタン】 -->
                                <div class="p-contact-send__button p-contact__submit">
                                    <button type="submit" class="c-button">
                                        <p>送 信</p>
                                    </button>
                                </div>

                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <!-- ※共通footer -->
        <footer class="l-footer">
            <div class="l-footer__main">
                <div class="l-footer__inner">

                    <div class="l-footer__nav">
                        <nav>
                            <ul>
                                <li><a href="./index.html">ホーム</a></li>
                                <li><a href="./plan.html">料金</a></li>
                                <li><a href="./blog_list.html">ブログ</a></li>
                                <li><a href="./result_list.html">卒業実績</a></li>
                            </ul>
                        </nav>
                    </div>

                    <div class="l-footer__logo">
                        <a href="./index.html">
                            <img
                                src="./images/common/logo-white.svg"
                                alt="きたむらミュージックスクール"
                                class="l-footer__logo-image">
                        </a>
                    </div>

                    <div class="l-footer__copyright">
                        <p>Copyright © 0000 KITAMURA music school Inc.<br class="sp-br"> All Rights</p>
                    </div>

                    <div class="l-footer__sns">
                        <ul>
                            <li>
                                <a href="#">
                                    <div class="l-footer__sns-icon">
                                        <img src="./images/common/icon-twitter.svg" alt="twitterアイコン">
                                    </div>
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    <div class="l-footer__sns-icon">
                                        <img src="./images/common/icon-facebook.svg" alt="facebookアイコン">
                                    </div>
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    <div class="l-footer__sns-icon">
                                        <img src="./images/common/icon-youtube.svg" alt="youtubeアイコン">
                                    </div>
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    <div class="l-footer__sns-icon">
                                        <img src="./images/common/icon-instagram.svg" alt="instagramアイコン">
                                    </div>
                                </a>
                            </li>
                        </ul>
                    </div> 
                </div>
            </div>
        </footer>

        <!-- ※共通buttons -->
        <div class="p-fixed-buttons">
            <!-- TOPへ戻るボタン -->            
            <a href="#" class="c-button--top2">
                <div class="c-button__icon">
                    <div class="c-button__icon--img">
                        <img src="./images/icon-to-top.svg" alt="ページ上部へ戻る">
                    </div>
                </div>  
            </a>
        </div>
            
    </div>
</body>
</html>
